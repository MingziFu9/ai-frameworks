# 第 1 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 1
chapter: 1
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出一个人工智能应用从数据到上线要经过的四个步骤，以及开发框架在其中的作用
  - 列举两个通用框架和两个国产框架，并说出它们各自适合什么场合
  - 解释为什么训练模型常常要用 GPU，什么是云算力
  skill:
  - 操作云端 Notebook：新建笔记本、运行单元格、上传文件、保存
  - 运行一段 Python 代码，读懂报错信息的最后一行
  quality:
  - 养成先看报错最后一行、再动手查找原因的习惯
  - 了解国产框架的发展，树立科技自立自强的意识
key_points:
- 人工智能应用是怎样做出来的
- 主流开发框架一览
- CPU、GPU 与云算力
- 云端 Notebook：打开网页就能写代码
difficulties:
- point: 区分框架、模型、平台三个概念
  solution: 用“厨房电器 / 做好的菜 / 租来的厨房”的比喻对照，让学生给 Keras、MobileNetV2、AI Studio 各贴一个标签
- point: 第一次使用云端 Notebook 不知从何下手
  solution: 线下课带学生现场注册、新建、运行第一个单元格，强调“从上往下依次运行”和“用完点停止”
process:
- phase: 课前（线上，4 学时）
  steps:
  - name: 自主学习（一）
    minutes: 70
    content: 阅读1.1、1.2、1.3 节：人工智能应用是怎样做出来的；主流开发框架一览；CPU、GPU 与云算力；操作交互动画“CPU 与 GPU 谁算得快”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 建立“数据 → 模型 → 训练 → 应用”的整体印象，认识主流框架
  - name: 自主学习（二）
    minutes: 65
    content: 阅读1.4、1.5、1.6 节：云端 Notebook：打开网页就能写代码；Python 小课堂①：运行第一段代码；前沿视窗：让大模型帮你写代码、解释代码
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 学会使用云端 Notebook 和最基本的 Python 语句
  - name: 线上实验
    minutes: 45
    content: 实验 1-1 打开云端 Notebook，运行第一段代码、实验 1-2 环境自检（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 区分框架、模型、平台三个概念
    teacher: 用“厨房电器 / 做好的菜 / 租来的厨房”的比喻对照，让学生给 Keras、MobileNetV2、AI Studio 各贴一个标签
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 第一次使用云端 Notebook 不知从何下手
    teacher: 线下课带学生现场注册、新建、运行第一个单元格，强调“从上往下依次运行”和“用完点停止”
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场演示实验 1-2 环境自检：故意少运行一个单元格，引出 NameError，示范怎样读报错的最后一行
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：你身边的哪些应用用到了 AI？它们可能是用什么框架做出来的？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“学生学习”打比方，说明做一个人工智能应用的四个步骤。
- 简答题：小王的单位使用华为的服务器和昇腾芯片，他应该优先考虑哪个框架？说明理由。
- 简答题：云端 Notebook 和在自己电脑上安装框架，各有什么优点？
- 实操题：在 Notebook 中新建一个单元格，用变量和 `print` 显示“我叫 ×××，本学期学习人工智能开发框架技术，共 72 学时”，其中名字和学时要先放进变量。写出代码和运行结果。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch01/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch01/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
