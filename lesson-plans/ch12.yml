# 第 12 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 12
chapter: 12
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出国产 AI 生态中框架、芯片、平台的主要代表
  - 描述一个 AI 项目从需求到维护的完整流程，以及做项目的好习惯
  skill:
  - 运行代码，对含有个人信息的文本做脱敏
  - 判断一个 AI 应用在个人信息、数据许可、生成内容标识等方面是否合规
  - 完成一个从数据到网页发布的小型综合项目
  quality:
  - 了解国产 AI 生态，增强科技自立自强的信心
  - 遵守个人信息保护等法规，做负责任的 AI 开发者
key_points:
- 国产 AI 生态
- 一个 AI 项目的完整流程
- 做项目的好习惯
- 数据安全与隐私
difficulties:
- point: 区分个人信息和敏感个人信息，掌握脱敏的方法
  solution: 用“脱敏”交互动画逐条处理客服记录，讨论哪些信息必须遮住
- point: 把全书方法串成一个完整项目
  solution: 用“项目七步”表回顾每一步对应的章节，提供三类选题的最小可行版本
process:
- phase: 课前（线上，4 学时）
  steps:
  - name: 自主学习（一）
    minutes: 70
    content: 阅读12.1、12.2、12.3、12.4 节：国产 AI 生态；一个 AI 项目的完整流程；做项目的好习惯；数据安全与隐私；操作交互动画“个人信息脱敏”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 了解国产 AI 生态和项目完整流程，体验昇思
  - name: 自主学习（二）
    minutes: 65
    content: 阅读12.5、12.6、12.7、12.8 节：本领域法规要点；综合项目指引；本章常见报错对照；前沿视窗：开源国产大模型与自主算力
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 掌握数据脱敏、相关法规要点，明确综合项目要求
  - name: 线上实验
    minutes: 45
    content: 实验 12-1 给一份客服记录做脱敏、实验 12-2 综合项目（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，2 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 区分个人信息和敏感个人信息，掌握脱敏的方法
    teacher: 用“脱敏”交互动画逐条处理客服记录，讨论哪些信息必须遮住
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 把全书方法串成一个完整项目
    teacher: 用“项目七步”表回顾每一步对应的章节，提供三类选题的最小可行版本
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场运行实验 12-1，展示 jieba 把“满天星”误当人名，讨论自动脱敏为什么还需要人工复核
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：你的项目数据里有没有个人信息？打算怎样处理？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
  - name: 综合项目开题
    minutes: 45
    content: 各组汇报选题、数据来源、个人信息处理办法和准确率目标
    teacher: 逐组点评，确认选题难度和合规性
    student: 填写项目计划表，汇报 3 分钟
    intent: 确保每组选题可行、数据来源合法
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：以本书的花卉识别助手为例，说明 AI 项目完整流程的七个步骤各做了什么。
- 简答题：为第 9 章的外卖评论分类器写一张简短的模型卡。
- 简答题：小林想把花店的会员数据（姓名、手机号、购买记录）交给大模型分析“哪些顾客可能流失”。请你从数据安全的角度给出建议。
- 实操题：修改实验 12-1 的手机号规则，让它既能找到 `13900001234`、`139-0000-5678`，也能找到 `139 0000 1357`（中间用空格分开）。
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch12/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch12/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
  - 本章国产版有 1 处“待实测”内容（需从飞桨服务器下载模型或调用 API），建议课前在 AI Studio 上运行一遍，把结果补进课件
