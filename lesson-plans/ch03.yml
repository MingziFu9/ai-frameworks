# 第 3 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 3
chapter: 3
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出彩色图片在框架里由哪三个维度的数字组成，什么是张量和形状
  - 解释为什么要把数据分成训练集和验证集、为什么要一批一批地处理
  - 说出文字和声音变成数字的基本思路
  skill:
  - 运行几行代码把一个文件夹的照片读成数据集，并读懂输出的形状和标签
  - 判断一组数据增强设置是否合适
  quality:
  - 重视数据质量，认识到“数据比模型更重要”
  - 使用公开数据集时遵守许可、注明来源
key_points:
- 图片在框架里是一张“数字表”
- 张量：框架里装数据的“多层盒子”
- 数据集：把几百张照片整理好
- 数据增强：一张照片当几张用
difficulties:
- point: 理解张量的形状和颜色通道的位置
  solution: 用“多层盒子”比喻和交互动画演示 (高, 宽, 3) → (批, 高, 宽, 3)；对比两版通道位置的不同
- point: 训练集和验证集为什么要分开
  solution: 用“平时作业和期末考试”比喻，强调验证集是模型没见过的题
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读3.1、3.2、3.3、3.4 节：图片在框架里是一张“数字表”；张量：框架里装数据的“多层盒子”；数据集：把几百张照片整理好；数据增强：一张照片当几张用；操作交互动画“图片变数字”“数据增强预览”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解图片怎样变成数字、什么是张量
  - name: 自主学习（二）
    minutes: 90
    content: 阅读3.5、3.6、3.7 节：文字和声音怎样变成数字；Python 小课堂③：索引、字典和形状报错；前沿视窗：数据比模型更重要
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 学会读入数据集、做数据增强，了解文字和声音的数字化
  - name: 线上实验
    minutes: 45
    content: 实验 3-1 把一张图片变成数字、实验 3-2 读入花卉数据集（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解张量的形状和颜色通道的位置
    teacher: 用“多层盒子”比喻和交互动画演示 (高, 宽, 3) → (批, 高, 宽, 3)；对比两版通道位置的不同
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 训练集和验证集为什么要分开
    teacher: 用“平时作业和期末考试”比喻，强调验证集是模型没见过的题
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场运行实验 3-2，打印一批数据的形状，再故意把图片大小改错，演示形状报错
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：如果所有郁金香照片都是晴天拍的，模型可能学到什么“歪门邪道”？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：为什么不能用训练集来检查模型学得好不好？
- 简答题：小林只有每类 150 张照片，又没时间再去拍。请说明数据增强为什么能帮上忙，并举出两种适合花卉照片的增强方式。
- 简答题：用一两句话分别说明文字和声音是怎样变成数字的。
- 实操题：修改实验 3-2 的代码，在读入数据集后，用一个字典把英文类别名翻译成中文，打印出第一批前 5 张照片的中文花名。写出新增的代码和运行结果。
- 实验报告：实验 3-1、实验 3-2、实验 3-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch03/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch03/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
