# 第 8 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 8
chapter: 8
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出分类、检测、分割、文字识别四种图像任务的区别
  - 解释检测结果中边界框、类别、置信度的含义，以及置信度门槛的作用
  skill:
  - 运行代码，用现成模型完成目标检测和文字识别，并把结果数一数、存成表格
  - 分析检测模型认错的原因，判断它是否适合自己的任务
  - 判断一个图像应用在隐私和授权上是否合规
  quality:
  - 使用人脸、车牌等图像技术时尊重他人隐私和肖像权
  - 认识到 AI 结果需要人工核对
key_points:
- 图像任务一览
- 目标检测：框出照片里的东西
- 文字识别：把图片里的字读出来
- 把结果用起来
difficulties:
- point: 目标检测的输出（类别、置信度、边界框）及置信度阈值的作用
  solution: 用交互动画拖动阈值，观察框的数量变化
- point: 把识别结果整理成表格等结构化数据
  solution: 现场把 OCR 结果用列表和字典整理成 pandas 表格，逐步打印中间结果
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读8.1、8.2、8.3、8.4 节：图像任务一览；目标检测：框出照片里的东西；文字识别：把图片里的字读出来；把结果用起来；操作交互动画“置信度门槛”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 了解分类、检测、分割的区别，用现成模型框出照片里的物体
  - name: 自主学习（二）
    minutes: 90
    content: 阅读8.5、8.6、8.7 节：能做和不能做：人脸、隐私与授权；本章常见报错对照；前沿视窗：看图说话的多模态大模型
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 学会文字识别并把结果整理成表格，了解图像应用的隐私边界
  - name: 线上实验
    minutes: 45
    content: 实验 8-1 目标检测：框出照片里的东西、实验 8-2 文字识别：把进货单变成表格（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 目标检测的输出（类别、置信度、边界框）及置信度阈值的作用
    teacher: 用交互动画拖动阈值，观察框的数量变化
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 把识别结果整理成表格等结构化数据
    teacher: 现场把 OCR 结果用列表和字典整理成 pandas 表格，逐步打印中间结果
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场用一张进货单图片演示 OCR → 表格的全过程
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：小区门口的人脸识别闸机，应该怎样告知和取得同意？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明分类、目标检测、文字识别分别回答什么问题，各举一个生活中的应用例子。
- 简答题：实验 8-3 中，门槛从 0.2 调到 0.6，花田游客从 13 人变成 6 人。到底该用哪个数？请说明你的思路。
- 简答题：为什么说“模型给出的框和文字”还不是老板娘想要的结果？从模型输出到有用的结果，本章做了哪些加工？
- 实操题：修改实验 8-3 的 `count_objects` 函数，增加一个参数 `target`，只返回指定类别的个数。用它数一数 `canal_street.jpg` 里有几辆车。
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch08/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch08/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
  - 本章国产版有 2 处“待实测”内容（需从飞桨服务器下载模型或调用 API），建议课前在 AI Studio 上运行一遍，把结果补进课件
