# 第 9 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 9
chapter: 9
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出文字变成数字的四步：分词、编号、填充、词向量
  - 解释词表外的字、截断会让模型丢失哪些信息
  skill:
  - 运行代码，用现成模型做情感分析，并训练一个自己的评论分类器
  - 分析模型判断错误的评论，找出和训练数据有关的原因
  - 比较自己训练的小模型和大模型 API 在效果、速度、费用和隐私上的差别，为具体任务做出选择
  quality:
  - 妥善保管 API 密钥，养成信息安全意识
  - 理性看待大模型，关注其成本、隐私与错误
key_points:
- 文字怎样变成数字
- 一行代码用现成模型
- 自己训练一个评论分类器
- 调用大模型 API 做同一件事
difficulties:
- point: 文字怎样变成数字：分词、词表、填充、词向量
  solution: 用“文字变数字”交互动画，把一句评论一步步变成编号和向量
- point: 自训练小模型和大模型 API 的取舍
  solution: 用表格对比准确率、速度、成本、隐私，让学生针对具体场景做选择
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读9.1、9.2、9.3 节：文字怎样变成数字；一行代码用现成模型；自己训练一个评论分类器；操作交互动画“文字变数字”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解文字的数字化，用现成模型做情感分析
  - name: 自主学习（二）
    minutes: 90
    content: 阅读9.4、9.5、9.6 节：调用大模型 API 做同一件事；本章常见报错对照；前沿视窗：大模型和小模型怎么分工
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 训练评论分类器，学会调用大模型 API 并比较两者
  - name: 线上实验
    minutes: 45
    content: 实验 9-1 一行代码做情感分析、实验 9-2 训练一个外卖评论分类器（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 文字怎样变成数字：分词、词表、填充、词向量
    teacher: 用“文字变数字”交互动画，把一句评论一步步变成编号和向量
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 自训练小模型和大模型 API 的取舍
    teacher: 用表格对比准确率、速度、成本、隐私，让学生针对具体场景做选择
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场展示“包装很好，可惜味道太咸了”被误判，讨论模型为什么没读懂转折
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：把顾客评论发给大模型 API 处理，可能有什么隐私风险？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“味道很好”为例，说明一句话变成模型能处理的数字要经过哪几步。
- 简答题：老板娘的店每周只有几百条评论，没有标注过的数据，评论里还有很多网络用语。你建议用自己训练的小模型还是大模型 API？说明理由。
- 简答题：为什么说“API Key 相当于账户的钥匙”？列出至少三条保管 API Key 的做法。
- 实操题：修改实验 9-2 的代码，把固定长度从 40 改成 10，重新训练，记录验证准确率；再用“文字变数字”动画看一看长评论被截掉了什么，说明截断可能带来的问题。
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
