# 第 10 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 10
chapter: 10
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出采样率、波形、声谱图的含义
  - 解释为什么可以把声谱图当图片，用卷积网络来识别声音
  skill:
  - 运行代码，完成语音合成和语音识别，并训练一个语音指令识别器
  - 比较不同语音识别模型的识别结果，分析出错的原因
  - 判断一个语音应用在录音授权和合成内容标识方面是否合规
  quality:
  - 尊重他人的声音权益，录音要授权、合成要标识
  - 关注语音技术在无障碍服务中的社会价值
key_points:
- 声音怎样变成数字
- 用现成模型识别和合成语音
- 把声谱图当图片：训练语音指令识别器
- 声音的权益：录音要授权、合成要标识
difficulties:
- point: 理解采样率、波形和声谱图
  solution: 用“听见声音”交互动画边听边看波形和声谱图，对比不同声音的差别
- point: 把声谱图当图片交给卷积网络的思路
  solution: 把第 4 章的花卉卷积网络和语音指令网络并排对照，指出只换了输入
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读10.1、10.2、10.3 节：声音怎样变成数字；用现成模型识别和合成语音；把声谱图当图片：训练语音指令识别器；操作交互动画“看见声音”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解声音的数字化，体验现成的语音识别和合成
  - name: 自主学习（二）
    minutes: 90
    content: 阅读10.4、10.5、10.6 节：声音的权益：录音要授权、合成要标识；本章常见报错对照；前沿视窗：能实时对话的语音大模型
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 训练语音指令识别器，了解声音的权益与合规
  - name: 线上实验
    minutes: 45
    content: 实验 10-1 看见声音：波形和声谱图、实验 10-2 训练一个语音指令识别器（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解采样率、波形和声谱图
    teacher: 用“听见声音”交互动画边听边看波形和声谱图，对比不同声音的差别
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 把声谱图当图片交给卷积网络的思路
    teacher: 把第 4 章的花卉卷积网络和语音指令网络并排对照，指出只换了输入
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场录一句话交给语音识别模型，比较 Whisper 与 Paraformer 的中文识别结果
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：用 AI 模仿某位名人的声音做短视频，可以吗？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明：图片、文字、声音分别是怎样变成模型能处理的数字的？
- 简答题：根据 10.2.3 节的对比表，比较 Whisper tiny 和 Paraformer 的识别结果，说说各自的特点，以及给老板娘的小店做语音下单应该选哪个。
- 简答题：实验 10-2 中，你用手机录的“yes”“no”很可能被认错。请从数据的角度分析原因。
- 实操题：在实验 10-2 的基础上加上早停（盯着验证损失，耐心 5 轮，恢复最好的参数），重新训练最多 40 轮，记录停在第几轮、最好的验证准确率是多少。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
