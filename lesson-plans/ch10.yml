  - 本版代码：labs/ch10/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch10/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
