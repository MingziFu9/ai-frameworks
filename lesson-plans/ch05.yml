# 第 5 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 5
chapter: 5
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出训练前要做的三项设置（损失函数、优化器、评价指标）和训练一批数据的五个步骤
  - 读懂训练日志中每一轮的损失和准确率
  - 解释一段训练循环代码中每一行对应五个步骤中的哪一步
  skill:
  - 运行代码训练一个花卉识别模型，保存它并用它预测新照片
  - 分析学习率、轮次对训练结果的影响
  quality:
  - 通过固定随机种子、记录实验结果，树立可复现的科学态度
  - 面对训练失败不急躁，按步骤排查
key_points:
- 训练前的三项设置
- 开始训练：fit
- 打开盒子：fit 背后的五个步骤
- 轮次、批大小和学习率
difficulties:
- point: 理解训练一批数据的五个步骤，尤其是梯度和反向传播
  solution: 用“学生做练习、对答案、找原因、改方法”的比喻，配合“训练五步走”动画逐步点击
- point: 学习率、轮次、批大小的含义与影响
  solution: 用“学习率大小的影响”动画对比三种学习率，再让学生在实验 5-3 中验证
process:
- phase: 课前（线上，6 学时）
  steps:
  - name: 自主学习（一）
    minutes: 110
    content: 阅读5.1、5.2、5.3、5.4 节：训练前的三项设置；开始训练：fit；打开盒子：fit 背后的五个步骤；轮次、批大小和学习率；操作交互动画“训练五步走”“学习率大小的影响”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 掌握训练前的三项设置，用 fit 训练第一个模型并读懂日志
  - name: 自主学习（二）
    minutes: 115
    content: 阅读5.5、5.6、5.7 节：保存模型、加载并预测；本章常见报错对照；前沿视窗：训练一个大模型要花多少钱
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 理解 fit 背后的五个步骤和三个超参数，学会保存和加载模型
  - name: 线上实验
    minutes: 45
    content: 实验 5-1 训练第一个花卉识别模型、实验 5-2 打开盒子：训练循环逐行对应五个步骤（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解训练一批数据的五个步骤，尤其是梯度和反向传播
    teacher: 用“学生做练习、对答案、找原因、改方法”的比喻，配合“训练五步走”动画逐步点击
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 学习率、轮次、批大小的含义与影响
    teacher: 用“学习率大小的影响”动画对比三种学习率，再让学生在实验 5-3 中验证
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场对照实验 5-2 的训练循环，逐行指出对应五个步骤中的哪一步
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：训练准确率 87%、验证准确率 55%，这个模型能交给老板娘用吗？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“学生做练习”的比喻，按顺序说明训练一批数据的五个步骤。
- 简答题：训练时损失一开始非常大，之后一直停在瞎猜的水平。你会先检查哪个设置？怎样调整？
- 简答题：比较“用 `fit` 训练”和“自己写训练循环”的优缺点。
- 实操题：用实验 5-1 训练好的模型，写一个 for 循环，依次预测 `test_photos` 文件夹中的 10 张照片，打印每张照片的文件名、预测的花名和把握，并统计认对了几张（文件名中下划线前面的部分就是正确答案）。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch05/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch05/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
