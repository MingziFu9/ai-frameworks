# 第 2 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 2
chapter: 2
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出什么是预训练模型、什么是推理，以及它们和训练的区别
  - 读懂模型的输出：类别名称、置信度和前 5 个答案
  skill:
  - 运行几行代码调用现成的图像分类模型，识别一张照片
  - 分析模型认错的原因，特别是“要认的东西不在模型学过的类别里”
  - 使用现成的文字识别模型，从图片中提取文字
  quality:
  - 使用现成模型时关注模型的适用范围和使用许可
  - 实事求是地记录模型的错误，不夸大 AI 的能力
key_points:
- 模型、预训练模型与推理
- 五行代码识别一张照片
- 现成模型还能做什么
- Python 小课堂②：函数参数、字符串和列表
difficulties:
- point: 理解模型输出的是“概率”，Top-5 和置信度的含义
  solution: 用第 2 章的识花结果截图，逐行解读 5 个概率，让学生说出“模型有多大把握”
- point: 函数参数、字符串和列表的写法
  solution: 结合五行识图代码，只讲本行用到的语法；改一个参数立刻运行看变化
process:
- phase: 课前（线上，4 学时）
  steps:
  - name: 自主学习（一）
    minutes: 70
    content: 阅读2.1、2.2、2.3 节：模型、预训练模型与推理；五行代码识别一张照片；现成模型还能做什么；操作交互动画“模型是怎样“看”图的”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解模型、预训练模型和推理，跑通五行识图代码
  - name: 自主学习（二）
    minutes: 65
    content: 阅读2.4、2.5 节：Python 小课堂②：函数参数、字符串和列表；前沿视窗：模型社区与“模型即服务”
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 了解现成模型能做的更多任务，掌握函数参数、字符串和列表
  - name: 线上实验
    minutes: 45
    content: 实验 2-1 让模型认出一张花的照片、实验 2-2 换图试试：认一批照片（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解模型输出的是“概率”，Top-5 和置信度的含义
    teacher: 用第 2 章的识花结果截图，逐行解读 5 个概率，让学生说出“模型有多大把握”
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 函数参数、字符串和列表的写法
    teacher: 结合五行识图代码，只讲本行用到的语法；改一个参数立刻运行看变化
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场用一张郁金香照片演示模型认错（它不认识郁金香），讨论现成模型的局限
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：模型说“雏菊 90%”就一定对吗？什么时候要怀疑它？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用表格或几句话说明训练和推理的三点区别。
- 简答题：实验 2-2 中，10 张花卉照片只认对了 2 张。请分析至少两个原因。
- 简答题：店里要做一个“拍照识花”的小程序，能直接用本章的预训练模型吗？为什么？
- 实操题：修改实验 2-2 的代码，让它只打印“把握大于 50%”的照片和答案，把握低的照片打印“我不确定”。写出修改后的循环部分和运行结果。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
edition_notes:
  keras:
  - 本版代码：labs/ch02/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  paddle:
  - 本版代码：labs/ch02/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
  - 本章国产版有 3 处“待实测”内容（需从飞桨服务器下载模型或调用 API），建议课前在 AI Studio 上运行一遍，把结果补进课件
