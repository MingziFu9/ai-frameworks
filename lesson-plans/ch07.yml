# 第 7 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 7
chapter: 7
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出迁移学习的含义，以及冻结、微调的作用
  - 解释为什么数据少的时候，迁移学习比从零训练效果好得多
  skill:
  - 运行代码，用预训练模型完成花卉识别的迁移学习，并预测新照片
  - 读懂混淆矩阵，找出模型最容易混淆的类别并分析原因
  - 判断一个任务该从零训练、迁移学习还是直接用现成模型
  quality:
  - 理解“站在巨人肩膀上”的开放协作精神，尊重他人成果和许可
  - 通过错误分析客观看待模型的不足
key_points:
- 迁移学习：把学过的本领用到新任务上
- 三步做迁移学习
- 效果：从五成多到八成多
- 微调：解冻后面几层
difficulties:
- point: 理解迁移学习为什么在数据少时有效
  solution: 对比从零训练 54.7% 和迁移学习 82.7% 的结果，用“请有经验的人换个岗位”比喻解释
- point: 冻结与微调的区别和使用时机
  solution: 用动画演示冻结和解冻的层，强调微调要用更小的学习率
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读7.1、7.2、7.3、7.4 节：迁移学习：把学过的本领用到新任务上；三步做迁移学习；效果：从五成多到八成多；微调：解冻后面几层；操作交互动画“冻结几层好”
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解迁移学习，用三步做出准确率高得多的识花模型
  - name: 自主学习（二）
    minutes: 90
    content: 阅读7.5、7.6、7.7、7.8 节：错误分析：混淆矩阵；低代码训练：不写代码也能迁移学习；本章常见报错对照；前沿视窗：预训练 + 微调，大模型时代的标准做法
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 学会微调和用混淆矩阵做错误分析
  - name: 线上实验
    minutes: 45
    content: 实验 7-1 迁移学习：借 MobileNetV2 认花、实验 7-2 错误分析：混淆矩阵和认错的照片（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解迁移学习为什么在数据少时有效
    teacher: 对比从零训练 54.7% 和迁移学习 82.7% 的结果，用“请有经验的人换个岗位”比喻解释
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 冻结与微调的区别和使用时机
    teacher: 用动画演示冻结和解冻的层，强调微调要用更小的学习率
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场展示混淆矩阵和认错的照片，引导学生分析玫瑰和郁金香为什么容易混
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：认错的照片里，哪些是模型的问题，哪些是照片本身的问题？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话解释：为什么同样 600 张照片，迁移学习比从零训练的验证准确率高这么多？
- 简答题：微调为什么要“先冻结训练好输出层，再解冻”？
- 简答题：根据本章的混淆矩阵和认错的照片，给小林提三条改进花卉识别助手的具体建议。
- 实操题：在实验 7-1 的基础上，给模型加上数据增强（第 6 章的三块增强积木，放在 `Rescaling` 前面），训练 15 轮，记录验证准确率，和不加增强时比较。
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
