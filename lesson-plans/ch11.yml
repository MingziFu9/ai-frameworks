# 第 11 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 11
chapter: 11
online: 5
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出部署的含义和几种常见的部署方式
  - 认出常见的模型文件格式，说出 ONNX 的作用
  - 解释量化的原理，根据实测结果分析它的得失
  skill:
  - 运行代码，用 Gradio 把模型做成网页，并发布给别人使用
  - 选择适合具体场景的部署方式
  quality:
  - 站在用户角度设计应用，写清楚能做和不能做的事
  - 发布应用前检查密钥、数据和许可，树立安全发布意识
key_points:
- 训练完以后：让模型变成别人能用的东西
- 模型文件长什么样
- 用 Gradio 做一个网页
- 发布到网上：生成一个链接
difficulties:
- point: 保证网页上的预处理和训练时一致
  solution: 现场演示删掉换算一行后网页全部认错，再恢复，让学生记住“预处理要一致”
- point: 理解量化、ONNX 的作用和代价
  solution: 用“模型压缩”交互动画对比大小、速度和准确率
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读11.1、11.2、11.3、11.4 节：训练完以后：让模型变成别人能用的东西；模型文件长什么样；用 Gradio 做一个网页；发布到网上：生成一个链接
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 了解部署方式和模型文件，用 Gradio 做出网页
  - name: 自主学习（二）
    minutes: 90
    content: 阅读11.5、11.6、11.7、11.8 节：让模型更小更快；其他部署方式；本章常见报错对照；前沿视窗：在自己电脑上运行大模型；操作交互动画“模型压缩”
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 学会发布网页，了解 ONNX、量化等让模型更小更快的方法
  - name: 线上实验
    minutes: 45
    content: 实验 11-1 做一个花卉识别网页、实验 11-2 发布给同学用（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，2 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 保证网页上的预处理和训练时一致
    teacher: 现场演示删掉换算一行后网页全部认错，再恢复，让学生记住“预处理要一致”
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 理解量化、ONNX 的作用和代价
    teacher: 用“模型压缩”交互动画对比大小、速度和准确率
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场把实验 11-1 的网页发布到云平台，生成链接让学生用手机打开
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：你的网页上应该放哪些提示语？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
  - name: 作品试用与互评
    minutes: 45
    content: 各组互相试用对方的花卉识别网页，记录认错的例子和界面问题
    teacher: 组织互评，汇总共性问题并点评
    student: 试用他组作品，填写互评表
    intent: 从用户角度发现问题，体验部署后的真实效果
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：说出部署一个图像识别模型的核心步骤，并说明哪一步最容易出错。
- 简答题：老板娘想让店员在手机上用花卉识别，店里网络不太好。你会推荐哪种部署方式？要注意什么？
- 简答题：用“高清照片压缩成小图”的比喻解释量化，并说出它的好处和代价。
- 实操题：把第 9 章的外卖评论分类器做成一个 Gradio 网页：输入一条评论，输出“好评”“差评”的概率。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
