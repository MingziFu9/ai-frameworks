  - 本版代码：labs/ch11/keras/，使用 Keras 3（TensorFlow 后端），建议在魔搭社区 Notebook 上运行
  - 本章通用版有 2 处“待实测”内容（需联网下载模型或调用 API），建议课前在平台上运行一遍，把结果补进课件
  paddle:
  - 本版代码：labs/ch11/paddle/，使用飞桨 PaddlePaddle，建议在飞桨 AI Studio 上运行
  - 本章国产版有 2 处“待实测”内容（需从飞桨服务器下载模型或调用 API），建议课前在 AI Studio 上运行一遍，把结果补进课件
