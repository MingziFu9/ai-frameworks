# 第 4 章教案底稿：自动生成后由编者补写了素养目标、难点与突破、教学过程。改完运行 python tools/make_lesson_plan.py build 4
chapter: 4
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出神经元、激活函数、全连接层、卷积层、池化层各自的作用
  - 解释为什么识别图片要用卷积网络，而不是只用全连接层
  skill:
  - 运行积木式代码搭出一个神经网络，并打印它的结构表
  - 读懂结构表中每层的输出形状和参数量，算出简单层的参数量
  - 分析增减层对参数量的影响
  quality:
  - 读代码时耐心逐行对照，养成严谨细致的习惯
  - 认识到模型规模与算力、能耗之间的关系
key_points:
- 神经网络：一层一层传话的流水线
- 第一个网络：用全连接层认鸢尾花
- 卷积网络：用“放大镜”看图片
- 读懂网络结构表
difficulties:
- point: 理解一层网络在做什么（加权求和 + 激活）
  solution: 用“一层一层传话的流水线”比喻，配合交互动画手算一个神经元
- point: 读懂结构表中的输出形状和参数量
  solution: 带学生手算一层全连接层和一层卷积层的参数量，与 summary 的结果对照
process:
- phase: 课前（线上，5 学时）
  steps:
  - name: 自主学习（一）
    minutes: 90
    content: 阅读4.1、4.2、4.3 节：神经网络：一层一层传话的流水线；第一个网络：用全连接层认鸢尾花；卷积网络：用“放大镜”看图片
    teacher: 在学习平台发布学习任务单和预习问题，开放讨论区
    student: 阅读网页教材、看课件，运行书中的小例子，在讨论区提问
    intent: 理解神经元、层和激活函数，搭出第一个全连接网络
  - name: 自主学习（二）
    minutes: 90
    content: 阅读4.4、4.5、4.6 节：读懂网络结构表；Python 小课堂④：对象、方法和长代码换行；前沿视窗：从几十万到几千亿参数；操作交互动画“搭积木：网络结构表”
    teacher: 跟踪学习进度，在讨论区答疑，收集共性问题带到线下课
    student: 继续阅读，完成在线作答的课后练习
    intent: 认识卷积层、池化层，读懂网络结构表
  - name: 线上实验
    minutes: 45
    content: 实验 4-1 搭一个三层网络，看懂结构表、实验 4-2 搭一个识别花卉的卷积网络（☆ 实验选做）
    teacher: 发布实验指导和记录表，在线答疑
    student: 在云端 Notebook 上完成第一档“跑通”，尝试第二档“改一改”，填写记录表
    intent: 把本章方法落到代码上，获得真实的运行结果
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 问题导入
    minutes: 5
    content: 回顾情景导入，展示课前讨论区的高频问题
    teacher: 梳理学生课前的疑问，提出本节课要解决的问题
    student: 对照自己的预习情况，提出疑问
    intent: 以学定教，聚焦难点
  - name: 难点精讲一
    minutes: 8
    content: 理解一层网络在做什么（加权求和 + 激活）
    teacher: 用“一层一层传话的流水线”比喻，配合交互动画手算一个神经元
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 难点精讲二
    minutes: 8
    content: 读懂结构表中的输出形状和参数量
    teacher: 带学生手算一层全连接层和一层卷积层的参数量，与 summary 的结果对照
    student: 跟随演示操作，回答提问
    intent: 突破难点
  - name: 演示与排错
    minutes: 9
    content: 现场在实验 4-3 中加减一层，对比参数量变化；讲清通用版和国产版写层的差别（是否写输入数）
    teacher: 现场演示，边运行边讲解，示范排错思路
    student: 观察并在自己的 Notebook 上跟做
    intent: 把知识用到真实代码上，学会读报错
  - name: 讨论
    minutes: 5
    content: 讨论：参数越多的模型一定越好吗？
    teacher: 组织讨论，点评要点
    student: 小组讨论并发言
    intent: 联系实际，培养职业素养
  - name: 课堂练习与小结
    minutes: 10
    content: 在网页上完成本章 3–5 道在线练习；用本章知识导图回顾要点
    teacher: 讲评错误率高的题，带领梳理知识导图，布置作业
    student: 在线作答，复述本章要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 课余
    content: 完成本章课后练习（简答、实操题），提交实验报告；选做 ☆ 实验
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“评委打分”的比喻，说明一个神经元做了哪几件事。
- 简答题：写出花卉网络中一张照片从输入到输出，形状依次经过的变化（只写高、宽、通道或个数）。
- 简答题：为什么把花卉网络的卷积层从三组减少到两组，总参数量反而从 83 万增加到 185 万？
- 实操题：搭一个识别鸢尾花的网络：输入 4 个数，两个隐藏层各 10 个神经元（ReLU），输出 3 类（Softmax）。先手算总参数量，再写出代码并打印结构表验证。
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
