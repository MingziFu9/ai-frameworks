<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型是怎样“看”图的</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.wrap { display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:start; }
@media (max-width:560px) { .wrap { grid-template-columns:1fr; } }
.photo img { width:100%; border-radius:8px; border:1px solid var(--line); }
.thumbs { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.thumbs img { width:52px; height:52px; object-fit:cover; border-radius:5px; border:2px solid transparent; cursor:pointer; }
.thumbs img.on { border-color:var(--accent); }
.barrow { grid-template-columns:9.5em 1fr 4em; }
.truth { font-size:13px; margin:4px 0 8px; }
</style>
</head>
<body>
<h1>模型是怎样“看”图的</h1>
<div class="sub">点下面的小图换一张照片，看现成模型 MobileNetV2 给出的前 5 个答案和“把握”。它只认识 ImageNet 里的 1000 种东西。</div>
<div class="thumbs" id="thumbs"></div>
<div class="wrap">
  <div class="photo"><img id="big" alt="当前照片"></div>
  <div>
    <div class="truth" id="truth"></div>
    <div id="bars"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<div class="note">数据来源：实验 2-2 的实际运行结果（Keras 3.15.1，MobileNetV2 ImageNet 权重）。照片来自 TensorFlow 花卉数据集，CC BY 2.0。</div>
<script>
(function () {
  var CN = {daisy:"雏菊", coral_fungus:"珊瑚菌", vase:"花瓶", picket_fence:"尖桩篱栅", shower_curtain:"浴帘", stone_wall:"石墙",
    bee:"蜜蜂", shoji:"日式纸拉门", ostrich:"鸵鸟", crane:"鹤", little_blue_heron:"小蓝鹭", Bedlington_terrier:"贝灵顿梗（狗）",
    titi:"伶猴", lakeside:"湖边", bittern:"麻鳽（鸟）", green_mamba:"绿曼巴蛇", limpkin:"秧鹤", grasshopper:"蚱蜢",
    moped:"轻便摩托", unicycle:"独轮车", mountain_bike:"山地车", tricycle:"三轮车", velvet:"天鹅绒", envelope:"信封",
    swab:"拖把", packet:"包装袋", handkerchief:"手帕", buckeye:"七叶树果", broccoli:"西兰花", cardoon:"刺菜蓟",
    sunscreen:"防晒霜", jellyfish:"水母", hip:"玫瑰果", pinwheel:"风车玩具", teddy:"泰迪熊", knot:"绳结", ant:"蚂蚁",
    greenhouse:"温室", pot:"花盆", worm_fence:"蛇形栅栏"};
  var TRUTH = {daisy:"雏菊", dandelion:"蒲公英", roses:"玫瑰", sunflowers:"向日葵", tulips:"郁金香"};
  var DATA = [{"file": "daisy_1.jpg", "top5": [["daisy", 0.3557], ["coral_fungus", 0.0304], ["vase", 0.0299], ["picket_fence", 0.0257], ["shower_curtain", 0.024]]}, {"file": "daisy_2.jpg", "top5": [["daisy", 0.8658], ["stone_wall", 0.002], ["bee", 0.0015], ["picket_fence", 0.0014], ["shoji", 0.0011]]}, {"file": "dandelion_1.jpg", "top5": [["ostrich", 0.1512], ["crane", 0.1026], ["little_blue_heron", 0.025], ["Bedlington_terrier", 0.025], ["titi", 0.0221]]}, {"file": "dandelion_2.jpg", "top5": [["lakeside", 0.034], ["bittern", 0.0239], ["green_mamba", 0.0238], ["limpkin", 0.0203], ["grasshopper", 0.0196]]}, {"file": "roses_1.jpg", "top5": [["vase", 0.3992], ["moped", 0.1044], ["unicycle", 0.0536], ["mountain_bike", 0.0327], ["tricycle", 0.0311]]}, {"file": "roses_2.jpg", "top5": [["velvet", 0.1523], ["envelope", 0.0621], ["swab", 0.0537], ["packet", 0.0425], ["handkerchief", 0.0355]]}, {"file": "sunflowers_1.jpg", "top5": [["bee", 0.1295], ["buckeye", 0.1199], ["broccoli", 0.0364], ["daisy", 0.0159], ["cardoon", 0.0139]]}, {"file": "sunflowers_2.jpg", "top5": [["daisy", 0.9047], ["bee", 0.0025], ["sunscreen", 0.0023], ["vase", 0.0014], ["jellyfish", 0.0012]]}, {"file": "tulips_1.jpg", "top5": [["hip", 0.1675], ["pinwheel", 0.1203], ["teddy", 0.0955], ["knot", 0.0523], ["ant", 0.042]]}, {"file": "tulips_2.jpg", "top5": [["picket_fence", 0.3652], ["greenhouse", 0.1324], ["pot", 0.1038], ["worm_fence", 0.0485], ["daisy", 0.0325]]}];
  var $ = function (id) { return document.getElementById(id); };
  DATA.forEach(function (d, i) {
    var im = document.createElement("img"); im.src = "img/" + d.file; im.alt = d.file;
    im.onclick = function () { show(i); }; $("thumbs").appendChild(im);
  });
  function show(i) {
    var d = DATA[i], kind = d.file.split("_")[0];
    $("big").src = "img/" + d.file;
    document.querySelectorAll("#thumbs img").forEach(function (im, k) { im.classList.toggle("on", k === i); });
    $("truth").innerHTML = "这张照片其实是：<b>" + TRUTH[kind] + "</b>";
    $("bars").innerHTML = d.top5.map(function (t) {
      var w = Math.max(1, t[1] * 100);
      return '<div class="barrow"><span>' + (CN[t[0]] || t[0]) + ' <span class="mono" style="color:#90a4ae">' + t[0] + '</span></span>' +
        '<div><div class="bar" style="width:' + w + '%"></div></div><span class="v">' + (t[1] * 100).toFixed(1) + '%</span></div>';
    }).join("");
    var top = d.top5[0], ok = kind === "daisy" && top[0] === "daisy";
    var m;
    if (ok) m = '<b class="ok">认对了。</b>“雏菊”正好在模型认识的 1000 种东西里。';
    else if (top[0] === "daisy") m = '<b class="bad">认错了，但错得有道理：</b>模型不认识' + TRUTH[kind] + '，就挑了最像的“雏菊”。';
    else m = '<b class="bad">认错了：</b>模型认识的 1000 种东西里没有' + TRUTH[kind] + '，只好挑一个“看着有点像”的。' +
      (top[1] < 0.2 ? "注意它的把握只有 " + (top[1] * 100).toFixed(1) + "%，说明它自己也很犹豫。" : "");
    $("msg").innerHTML = m;
  }
  show(0);
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
