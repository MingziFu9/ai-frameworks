    "yes": "看声谱图：前半段“ye”下面有一条条横纹（元音），后半段“s”是上方一片亮的“沙沙声”，几乎没有横纹。",
    "no": "“no”整段都是元音，横纹又多又清楚，从开始一直延续到结束。",
    "up": "“up”很短，只占 0.35～0.55 秒左右，前后都是安静的背景；最右边一条全暗的，是录音不满 1 秒、补上的 0。",
    "down": "“down”比 up 长得多，元音的横纹从 0.35 秒一直延续到 0.8 秒左右。不同的词，声谱图的形状明显不同。",
    "哆咪嗦（编者合成）": "纯音只有一个频率，声谱图上就是一条细线；音越高，线的位置越往上，一步一个台阶。"
  };
  var cur = 0, audio = new Audio(), raf = 0;
  function cmap(v) { var t = v / 255; return [Math.round(68 + t * 185), Math.round(1 + t * 230), Math.round(84 + (t < .5 ? t * 150 : (1 - t) * 150))]; }
  function draw(pos) {
    var d = DATA[cur], w = $("wave"), c = w.getContext("2d"), W = w.width, H = w.height;
    c.clearRect(0, 0, W, H); c.fillStyle = "#3f51b5";
    var n = d.env.length;
    for (var i = 0; i < n; i++) { var h = d.env[i] * (H / 2 - 4); c.fillRect(i * W / n, H / 2 - h, Math.max(1, W / n - 0.5), 2 * h || 1); }
    var s = $("spec"), sc = s.getContext("2d"), R = d.spec.length, C = d.spec[0].length;
    var img = sc.createImageData(C, R);
    for (var r = 0; r < R; r++) for (var k = 0; k < C; k++) { var p = ((R - 1 - r) * C + k) * 4, col = cmap(d.spec[r][k]); img.data[p] = col[0]; img.data[p + 1] = col[1]; img.data[p + 2] = col[2]; img.data[p + 3] = 255; }
    var tmp = document.createElement("canvas"); tmp.width = C; tmp.height = R; tmp.getContext("2d").putImageData(img, 0, 0);
    sc.imageSmoothingEnabled = false; sc.drawImage(tmp, 0, 0, s.width, s.height);
    if (pos !== undefined) { [c, sc].forEach(function (g, j) { g.fillStyle = "#e53935"; g.fillRect(pos * W - 1, 0, 2, j ? s.height : H); }); }
  }
  function choose(i) {
    cur = i; audio.pause(); audio = new Audio(DATA[i].file);
    Array.prototype.forEach.call(document.querySelectorAll("#pick button"), function (b, j) { b.classList.toggle("on", j === i); });
    $("info").textContent = "1 秒 · 8000 个采样点 · 声谱图 40 × 63";
    $("msg").innerHTML = TIPS[DATA[i].name] || ""; draw();
  }
  DATA.forEach(function (d, i) { var b = document.createElement("button"); b.textContent = d.name; b.onclick = function () { choose(i); }; $("pick").appendChild(b); });
  $("play").onclick = function () {
    audio.currentTime = 0; audio.play();
    cancelAnimationFrame(raf);
    (function tick() { draw(Math.min(1, audio.currentTime)); if (!audio.paused && !audio.ended) raf = requestAnimationFrame(tick); else draw(); })();
  };
  choose(0);
})();
