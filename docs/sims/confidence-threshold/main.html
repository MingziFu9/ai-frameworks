<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>置信度门槛</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.wrap { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:14px; align-items:start; max-width:860px; }
@media (max-width:640px) { .wrap { grid-template-columns:1fr; } }
.pic { position:relative; width:100%; }
.pic img { width:100%; display:block; border-radius:6px; }
.pic svg { position:absolute; left:0; top:0; width:100%; height:100%; }
.cnt { font-size:13px; }
.cnt div { display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:2px 0; }
</style>
</head>
<body>
<h1>置信度门槛</h1>
<div class="sub">检测模型会给每个框一个“把握”（置信度）。拖动门槛，只显示把握高于门槛的框，看看数出来的结果怎么变。</div>
<div class="row ex"><span class="lbl">照片：</span><span id="pics"></span></div>
<div class="row"><span>门槛</span><input type="range" id="th" min="5" max="95" value="40"><span class="big mono" id="thv"></span></div>
<div class="wrap">
  <div class="pic"><img id="img" alt="检测用的照片"><svg id="sv" preserveAspectRatio="none"></svg></div>
  <div><div class="cnt" id="cnt"></div><div class="msg" id="msg"></div></div>
</div>
<div class="note">数据来源：YOLO11n（ultralytics 8.4，COCO 80 类）对随书照片的实际检测结果，门槛 5% 以上的框全部保留，由滑块筛选。照片来自 TensorFlow 花卉数据集，CC BY 2.0。</div>

  var NAMES = { tulip_field: "花田游客", canal_street: "运河街景", glass_domes: "玻璃罩花", grey_roses: "黑白玫瑰" };
  var COL = ["#3f51b5", "#e53935", "#43a047", "#ef6c00", "#8e24aa", "#00897b", "#6d4c41", "#546e7a"];
  var $ = function (id) { return document.getElementById(id); }, cur = "tulip_field";
  $("pics").innerHTML = Object.keys(D).map(function (k) { return '<button data-k="' + k + '">' + NAMES[k] + "</button>"; }).join("");
  function draw() {
    var d = D[cur], th = +$("th").value / 100, kinds = [], h = "", cnt = {};
    $("thv").textContent = Math.round(th * 100) + "%";
    $("sv").setAttribute("viewBox", "0 0 " + d.w + " " + d.h);
    d.boxes.forEach(function (b) {
      if (b[1] < th) return;
      if (kinds.indexOf(b[0]) < 0) kinds.push(b[0]);
      var c = COL[kinds.indexOf(b[0]) % COL.length]; cnt[b[0]] = (cnt[b[0]] || 0) + 1;

        '<text x="' + (b[2] + 2) + '" y="' + (b[3] + d.w / 40) + '" font-size="' + d.w / 38 + '" fill="#fff" stroke="' + c + '" stroke-width="' + d.w / 160 + '" paint-order="stroke">' + (CN[b[0]] || b[0]) + " " + Math.round(b[1] * 100) + "</text>";
