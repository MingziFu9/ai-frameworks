<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例动画：点击计数器</title>
<link rel="stylesheet" href="../common/sim.css">
</head>
<body>
<h1>示例动画：点击计数器</h1>
<div class="sub">这是动画模板：标题一句话说出要点，副标题说明怎么操作。新动画复制本文件夹，改名后在此基础上写。</div>
<div class="row">
  <button class="main" id="inc">加一</button>
  <button id="reset">清零</button>
  <span class="big" id="n">0</span>
</div>
<div class="barrow"><span>次数</span><div><div class="bar" id="bar" style="width:0"></div></div><span class="v" id="v">0 / 10</span></div>
<div class="msg" id="msg"></div>
<script>
(function () {
  var n = 0, MAX = 10;
  function render() {
    document.getElementById("n").textContent = n;
    document.getElementById("v").textContent = n + " / " + MAX;
    document.getElementById("bar").style.width = (n / MAX * 100) + "%";
    document.getElementById("msg").textContent = n === MAX ? "到上限了，点“清零”重新开始。" : "";
    document.getElementById("inc").disabled = n === MAX;
  }
  document.getElementById("inc").onclick = function () { n += 1; render(); };
  document.getElementById("reset").onclick = function () { n = 0; render(); };
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
