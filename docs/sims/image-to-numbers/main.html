<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片变数字</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.wrap { display:grid; grid-template-columns:260px 1fr; gap:14px; align-items:start; }
@media (max-width:600px) { .wrap { grid-template-columns:1fr; } }
canvas#view { width:256px; height:256px; image-rendering:pixelated; border:1px solid var(--line); border-radius:6px; cursor:crosshair; touch-action:none; }
.px { display:inline-block; width:22px; height:22px; border-radius:4px; vertical-align:middle; border:1px solid var(--line); margin-right:6px; }
table.t td { min-width:3em; font-variant-numeric:tabular-nums; }
td.r { color:#c62828; } td.g { color:#2e7d32; } td.b { color:#1565c0; }
td.cur { outline:2px solid var(--accent); }
</style>
</head>
<body>
<h1>图片变数字</h1>
<div class="sub">在左边的图上点一下（或拖动），右边显示这个点和它周围的红、绿、蓝三个数字。拖动“分辨率”看看图片被缩小成多少个格子。</div>
<div class="row ex"><span class="lbl">换图：</span>
  <button data-img="sunflowers_1.jpg" class="on">向日葵</button><button data-img="tulips_1.jpg">郁金香</button><button data-img="roses_1.jpg">玫瑰</button>
</div>
<div class="row"><span>分辨率</span><input type="range" id="res" min="0" max="4" value="2"><span class="mono big" id="resv"></span></div>
<div class="row ex"><span class="lbl">只看一个颜色：</span>
  <button data-ch="-1" class="on">全部</button><button data-ch="0">红</button><button data-ch="1">绿</button><button data-ch="2">蓝</button>
</div>
<div class="wrap">
  <div><canvas id="view" width="256" height="256"></canvas></div>
  <div>
    <div id="shape" class="msg"></div>
    <div id="pick" class="msg"></div>
    <div id="nb"></div>
  </div>
</div>
<div class="note">照片来自 TensorFlow 花卉数据集，CC BY 2.0。数值和实验 3-1 一样是 0～255 的整数；送进模型前通常除以 255 变成 0～1。</div>
<script>
(function () {
  var SIZES = [8, 16, 32, 64, 128], $ = function (id) { return document.getElementById(id); };
  var src = document.createElement("canvas"), sctx = src.getContext("2d", { willReadFrequently: true });
  var view = $("view"), vctx = view.getContext("2d"), img = new Image(), data = null, N = 32, ch = -1, sel = [16, 16];
  function load(name) { img.onload = draw; img.src = "img/" + name; }
  function draw() {
    N = SIZES[+$("res").value]; src.width = src.height = N;
    sctx.drawImage(img, 0, 0, N, N); data = sctx.getImageData(0, 0, N, N).data;
    var out = vctx.createImageData(N, N);
    for (var i = 0; i < N * N; i++) for (var c = 0; c < 3; c++) out.data[i * 4 + c] = ch < 0 ? data[i * 4 + c] : (c === ch ? data[i * 4 + ch] : 0);
    for (i = 0; i < N * N; i++) out.data[i * 4 + 3] = 255;
    view.width = view.height = N; vctx.putImageData(out, 0, 0);
    if (sel[0] >= N || sel[1] >= N) sel = [N >> 1, N >> 1];
    $("resv").textContent = N + "×" + N;
    $("shape").innerHTML = "形状 <b class='mono'>(" + N + ", " + N + ", 3)</b>：" + N + " 行 × " + N + " 列 × 3 个颜色 = <b>" + (N * N * 3).toLocaleString() + "</b> 个数字";
    show();
  }
  function px(r, c) { var k = (r * N + c) * 4; return [data[k], data[k + 1], data[k + 2]]; }
  function show() {
    var r = sel[0], c = sel[1], p = px(r, c);
    $("pick").innerHTML = '<span class="px" style="background:rgb(' + p + ')"></span>第 ' + r + ' 行、第 ' + c + ' 列：红 <b>' + p[0] + '</b>，绿 <b>' + p[1] + '</b>，蓝 <b>' + p[2] + '</b>';
    var names = ["红", "绿", "蓝"], cls = ["r", "g", "b"], h = "";
    for (var k = 0; k < 3; k++) {
      if (ch >= 0 && k !== ch) continue;
      h += '<table class="t" style="display:inline-table;margin-right:6px"><tr><th colspan="5">' + names[k] + '色通道（周围 5×5）</th></tr>';
      for (var i = r - 2; i <= r + 2; i++) {
        h += "<tr>";
        for (var j = c - 2; j <= c + 2; j++) {
          var ok = i >= 0 && j >= 0 && i < N && j < N;
          h += '<td class="' + cls[k] + (i === r && j === c ? " cur" : "") + '">' + (ok ? px(i, j)[k] : "") + "</td>";
        }
        h += "</tr>";
      }
      h += "</table>";
    }
    $("nb").innerHTML = h;
  }
  function pick(e) {
    var b = view.getBoundingClientRect();
    sel = [Math.min(N - 1, Math.max(0, Math.floor((e.clientY - b.top) / b.height * N))), Math.min(N - 1, Math.max(0, Math.floor((e.clientX - b.left) / b.width * N)))];
    show();
  }
  var down = false;
  view.addEventListener("pointerdown", function (e) { down = true; pick(e); });
  view.addEventListener("pointermove", function (e) { if (down) pick(e); });
  window.addEventListener("pointerup", function () { down = false; });
  $("res").oninput = draw;
  document.querySelectorAll("[data-img]").forEach(function (b) { b.onclick = function () {
    document.querySelectorAll("[data-img]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); load(b.dataset.img); }; });
  document.querySelectorAll("[data-ch]").forEach(function (b) { b.onclick = function () {
    document.querySelectorAll("[data-ch]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); ch = +b.dataset.ch; draw(); }; });
  load("sunflowers_1.jpg");
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
